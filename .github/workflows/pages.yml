# Deploy apps/explorer to GitHub Pages. The app is static: no build step.
# The catalog data stays on Source Cooperative; the app reads it over HTTPS.
name: pages

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the explorer unit tests
        run: cd apps/explorer && node --test *.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site from tracked files only
        run: |
          mkdir -p site
          git ls-files -z apps/explorer | while IFS= read -r -d '' f; do
            dest="site/${f#apps/explorer/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          rm -f site/serve.py site/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
