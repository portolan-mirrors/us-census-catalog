# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Generated data
# artifacts (GeoParquet, PMTiles) live inside catalog/ but are gitignored:
# they publish with the metadata while staying out of the repository.
# Source downloads live in staging/ and are NEVER published.

write_prefix: s3://portolan-mirrors/us-census-catalog
public_base: https://data.source.coop/portolan-mirrors/us-census-catalog
region: us-west-2
endpoint_url: https://data.source.coop
profile: source-coop-svc

# The directory that IS the published catalog, synced 1:1 to write_prefix.
publish_dir: catalog
